[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -iquote include
    -Iinclude
    -DUSER_SETUP_LOADED=1
    ; 3.5-inch 480x320 SPI TFT Driver (ILI9488 default for red PCB; switch to -DST7796_DRIVER=1 if ST7796S)
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=40000000
lib_deps =
    bblanchon/ArduinoJson
    https://github.com/pschatzmann/ESP32-A2DP.git
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
